name: MoonZod CI

on:
  push:
    branches: [ main, develop ]
  pull_request: {}

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update Registry Index
        run: moon update

      - name: Check Formatting
        run: moon fmt --check

      - name: Check Workspace
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Build Wasm
        run: moon build --target wasm --release

      - name: Run Workspace Tests
        run: moon test --enable-coverage

      - name: Package Workspace Modules
        run: |
          moon -C core package --list
          moon -C exporters package --list
          moon -C importers package --list
          moon -C moon_zod package --list
          python .github/scripts/check_workspace_archives.py

      - name: Check Native Async Package
        run: moon check moon_zod/async --target native --deny-warn

      - name: Run Native Async Tests
        run: moon test moon_zod/async --target native --enable-coverage

      - name: Code Line Count (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== Source Code Lines ==="
          core=$(find core moon_zod/combinators -name "*.mbt" ! -name "*_wbtest*" | xargs wc -l | tail -1)
          async_lines=$(find moon_zod/async -name "*.mbt" ! -name "*_test.mbt" | xargs wc -l | tail -1)
          exporters=$(find exporters -name "*.mbt" | xargs wc -l | tail -1)
          importers=$(find importers -name "*.mbt" | xargs wc -l | tail -1)
          cli=$(find moon_zod/cmd moon_zod/examples -name "*.mbt" | xargs wc -l | tail -1)
          tests=$(find moon_zod/tests -name "*.mbt" | xargs wc -l | tail -1)
          root=$(find moon_zod -maxdepth 1 -name "*.mbt" | xargs wc -l | tail -1)
          total=$(( $(echo "$async_lines" | awk '{print $1}') + $(echo "$core" | awk '{print $1}') + $(echo "$exporters" | awk '{print $1}') + $(echo "$importers" | awk '{print $1}') + $(echo "$cli" | awk '{print $1}') + $(echo "$tests" | awk '{print $1}') + $(echo "$root" | awk '{print $1}') ))
          echo "  core/:           $core"
          echo "  async/:          $async_lines"
          echo "  exporters/:      $exporters"
          echo "  importers/:      $importers"
          echo "  cmd/ + examples/: $cli"
          echo "  tests/:          $tests"
          echo "  root:            $root"
          echo "  Total:           $total"
          echo "::notice title=Lines of Code::core: $core | async: $async_lines | exporters: $exporters | importers: $importers | tests: $tests"

      - name: Code Line Count (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Count-Lines($paths, $excludePattern = $null) {
            $files = @()
            foreach ($path in $paths) {
              $files += Get-ChildItem -Path $path -Recurse -Filter "*.mbt" -File
            }
            if ($excludePattern) {
              $files = $files | Where-Object { $_.Name -notlike $excludePattern }
            }
            $lines = 0
            foreach ($file in $files) {
              $lines += (Get-Content -Path $file.FullName).Count
            }
            return $lines
          }

          Write-Output "=== Source Code Lines ==="
          $core = Count-Lines @("core", "moon_zod/combinators") "*_wbtest*"
          $async_lines = Count-Lines @("moon_zod/async") "*_test.mbt"
          $exporters = Count-Lines @("exporters")
          $importers = Count-Lines @("importers")
          $cli = Count-Lines @("moon_zod/cmd", "moon_zod/examples")
          $tests = Count-Lines @("moon_zod/tests")
          $root = (Get-ChildItem -Path moon_zod -Filter "*.mbt" -File | ForEach-Object { (Get-Content -Path $_.FullName).Count } | Measure-Object -Sum).Sum
          if ($null -eq $root) { $root = 0 }
          $total = $core + $async_lines + $exporters + $importers + $cli + $tests + $root
          Write-Output "  core/:            $core"
          Write-Output "  async/:           $async_lines"
          Write-Output "  exporters/:       $exporters"
          Write-Output "  importers/:       $importers"
          Write-Output "  cmd/ + examples/: $cli"
          Write-Output "  tests/:           $tests"
          Write-Output "  root:             $root"
          Write-Output "  Total:            $total"
          Write-Output "::notice title=Lines of Code::core: $core | async: $async_lines | exporters: $exporters | importers: $importers | tests: $tests"

      - name: Test Coverage Summary
        run: python -m unittest discover -s .github/scripts -p test_coverage_summary.py

      - name: Report Line Coverage
        run: python .github/scripts/coverage_summary.py
